[project]
name = "ygg"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "sabuwu", email = "sabuwu091@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "discord.py>=2.5.0,<3.0.0",
    "python-dotenv>=1.0.1,<2.0.0",
    "prompt-toolkit>=3.0.0,<4.0.0",
]

[project.scripts]
ygg = "ygg.__main__:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "ygg"
module-root = "src"
